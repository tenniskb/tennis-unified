site_name: Tennis Unified Library
use_directory_urls: false
site_description: Comprehensive unified tennis knowledge base — Fundamentals, Stroke Analysis, Foundation/Advanced/Elite, Anatomy Lab, Angle Atlas, Reference Library, and more
site_author: Henry Pham
copyright: © 2026 Henry Phạm Đức · Tennis Future Lab Research · All contents are for educational purpose.
theme:
  name: material
  custom_dir: docs/theme
  palette:
    primary: teal
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.prune
    - search.highlight
    - search.suggest
    - alternate
  language: en
  alternate:
    - name: English
      link: /
      lang: en
    - name: Tiếng Việt
      link: /vi/
      lang: vi
extra_css:
  - assets/css/style.css
  - assets/css/extra.css
  - assets/css/enhancements.css
  - assets/css/phase5.css
extra_javascript:
  - assets/js/extra.js
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - footnotes
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav_translations:
